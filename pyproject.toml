[project]
name = "chu-dev"
version = "0.1.0"
description = "CHU local development and graph validation tools"
requires-python = ">=3.13,<3.14"
dependencies = [
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "ruff>=0.12,<1",
  "pytest>=8,<10",
]

[tool.uv]
package = false
required-version = "==0.12.3"

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["scripts/*.py", "tests/*.py", "chu_core_prototype/*.py", "plan/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
