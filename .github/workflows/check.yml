name: CHU development verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install pinned Elan manager
        run: |
          python3 scripts/download_tool.py elan-init
          .chu/tools/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Bootstrap pinned toolchains and graph tools
        run: python3 scripts/bootstrap.py
      - name: Verify all registered checks
        run: ./chu check --json
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chu-verification
          path: .chu/runs/
          include-hidden-files: true
          if-no-files-found: warn
